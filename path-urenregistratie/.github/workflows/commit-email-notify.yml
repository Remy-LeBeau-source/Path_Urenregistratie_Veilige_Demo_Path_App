name: PR Team Notification

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  pull-requests: write

jobs:
  notify-team:
    name: Notify team on PR
    runs-on: ubuntu-latest
    if: ${{ vars.NOTIFY_USER_1 != '' || vars.NOTIFY_USER_2 != '' }}

    steps:
      - name: Comment and mention team members
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;

            if (!pr) {
              core.info('Geen pull_request context gevonden; niets te doen.');
              return;
            }

            const users = [process.env.NOTIFY_USER_1, process.env.NOTIFY_USER_2]
              .filter(Boolean)
              .map(u => String(u).trim().replace(/^@/, ''))
              .filter(Boolean);

            if (users.length === 0) {
              core.info('Geen notify users geconfigureerd.');
              return;
            }

            const mentions = users.map(u => `@${u}`).join(' ');
            const body = [
              'Team notificatie voor nieuwe PR.',
              '',
              mentions,
              '',
              `PR: #${pr.number} - ${pr.title}`,
              `Auteur: @${pr.user.login}`,
              `Branch: ${pr.head.ref} -> ${pr.base.ref}`,
              `Link: ${pr.html_url}`
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body
            });
        env:
          NOTIFY_USER_1: ${{ vars.NOTIFY_USER_1 }}
          NOTIFY_USER_2: ${{ vars.NOTIFY_USER_2 }}
