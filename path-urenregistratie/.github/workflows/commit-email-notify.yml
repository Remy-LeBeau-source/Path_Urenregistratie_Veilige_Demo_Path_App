name: Commit Team Notification

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  notify-team:
    name: Notify team on commit push
    runs-on: ubuntu-latest
    if: ${{ vars.NOTIFY_USER_1 != '' || vars.NOTIFY_USER_2 != '' }}

    steps:
      - name: Post team mention notification
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const commitSha = context.sha;
            const notificationIssueTitle = 'Commit Notifications';

            const users = [process.env.NOTIFY_USER_1, process.env.NOTIFY_USER_2]
              .filter(Boolean)
              .map(u => String(u).trim().replace(/^@/, ''))
              .filter(Boolean);

            if (users.length === 0) {
              core.info('Geen notify users geconfigureerd.');
              return;
            }

            const mentions = users.map(u => `@${u}`).join(' ');
            const body = [
              'Team notificatie voor nieuwe commit push.',
              '',
              mentions,
              '',
              `Repository: ${owner}/${repo}`,
              `Branch: ${context.ref.replace('refs/heads/', '')}`,
              `Auteur: @${context.actor}`,
              `Commit: ${commitSha}`,
              `Link: ${context.payload.head_commit?.url || `${context.serverUrl}/${owner}/${repo}/commit/${commitSha}`}`
            ].join('\n');

            const issues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            let issue = issues.data.find(item => !item.pull_request && item.title === notificationIssueTitle);

            if (!issue) {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title: notificationIssueTitle,
                body: 'Automatisch aangemaakt door workflow. Deze issue verzamelt commit-notificaties met @mentions.'
              });
              issue = created.data;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body
            });
        env:
          NOTIFY_USER_1: ${{ vars.NOTIFY_USER_1 }}
          NOTIFY_USER_2: ${{ vars.NOTIFY_USER_2 }}
