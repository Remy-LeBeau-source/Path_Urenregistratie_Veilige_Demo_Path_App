name: Commit Team Notification

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notify-team:
    name: Notify team on commit push
    runs-on: ubuntu-latest
    if: ${{ vars.NOTIFY_USER_1 != '' || vars.NOTIFY_USER_2 != '' }}

    steps:
      - name: Comment and mention team members on commit
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const commitSha = context.sha;

            const users = [process.env.NOTIFY_USER_1, process.env.NOTIFY_USER_2]
              .filter(Boolean)
              .map(u => String(u).trim().replace(/^@/, ''))
              .filter(Boolean);

            if (users.length === 0) {
              core.info('Geen notify users geconfigureerd.');
              return;
            }

            const mentions = users.map(u => `@${u}`).join(' ');
            const body = [
              'Team notificatie voor nieuwe commit push.',
              '',
              mentions,
              '',
              `Repository: ${owner}/${repo}`,
              `Branch: ${context.ref.replace('refs/heads/', '')}`,
              `Auteur: @${context.actor}`,
              `Commit: ${commitSha}`,
              `Link: ${context.payload.head_commit?.url || `${context.serverUrl}/${owner}/${repo}/commit/${commitSha}`}`
            ].join('\n');

            await github.rest.repos.createCommitComment({
              owner,
              repo,
              commit_sha: commitSha,
              body
            });
        env:
          NOTIFY_USER_1: ${{ vars.NOTIFY_USER_1 }}
          NOTIFY_USER_2: ${{ vars.NOTIFY_USER_2 }}
