name: Release Pipeline (dev-tst1-acc-prod)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/sha)"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: release-pipeline
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: path-urenregistratie
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: path_urenregistratie
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: path-urenregistratie/package-lock.json

      - name: Setup PHP with PDO MySQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Write CI config.local.php
        run: |
          cat > server/config.local.php <<'PHP'
          <?php
          return [
              'environment' => 'development',
              'app_origin' => 'http://127.0.0.1:8000',
              'allow_demo_migrations' => true,
              'host' => '127.0.0.1',
              'database' => 'path_urenregistratie',
              'username' => 'root',
              'password' => 'root',
              'port' => 3306,
              'charset' => 'utf8mb4',
          ];
          PHP

      - name: Start PHP server
        run: |
          php -S 127.0.0.1:8000 -t . > /tmp/php-server.log 2>&1 &
          echo $! > /tmp/php-server.pid
          sleep 2

      - name: Run install + migrations
        run: |
          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:8000/server/health.php > /tmp/health.json; then
              break
            fi
            echo "Waiting for PHP server... attempt $i"
            sleep 1
          done
          cat /tmp/health.json

          install_ok=0
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/server/install.php > /tmp/install.json; then
              install_ok=1
              break
            fi
            echo "install.php not ready yet... attempt $i"
            sleep 1
          done
          if [ "$install_ok" -ne 1 ]; then
            echo "install.php failed after retries"
            exit 1
          fi

          migrate_ok=0
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/server/migrate.php > /tmp/migrate.json; then
              migrate_ok=1
              break
            fi
            echo "migrate.php not ready yet... attempt $i"
            sleep 1
          done
          if [ "$migrate_ok" -ne 1 ]; then
            echo "migrate.php failed after retries"
            exit 1
          fi

          cat /tmp/install.json
          cat /tmp/migrate.json

      - name: Generate temporary test passwords
        run: |
          echo "PLAYWRIGHT_ADMIN_PASSWORD=$(openssl rand -base64 24 | tr -d '=+/\n' | head -c 24)" >> $GITHUB_ENV
          echo "PLAYWRIGHT_EMPLOYEE_PASSWORD=$(openssl rand -base64 24 | tr -d '=+/\n' | head -c 24)" >> $GITHUB_ENV

      - name: Set CI test password hashes in DB
        run: |
          php -r '
            $cfg = require "server/config.local.php";
            $dsn = "mysql:host={$cfg["host"]};port={$cfg["port"]};dbname={$cfg["database"]};charset={$cfg["charset"]}";
            $pdo = new PDO($dsn, $cfg["username"], $cfg["password"], [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
            $adminHash = password_hash(getenv("PLAYWRIGHT_ADMIN_PASSWORD"), PASSWORD_DEFAULT);
            $employeeHash = password_hash(getenv("PLAYWRIGHT_EMPLOYEE_PASSWORD"), PASSWORD_DEFAULT);
            $q = $pdo->prepare("UPDATE users SET password_hash = :h WHERE email = :e AND role = :r");
            $q->execute([":h" => $adminHash, ":e" => "admin@example.invalid", ":r" => "administrator"]);
            $q->execute([":h" => $employeeHash, ":e" => "stasjo@example.invalid", ":r" => "employee"]);
            echo "Updated CI login hashes.\n";
          '

      - name: Build
        run: npm run build

      - name: Smoke check
        run: npm run check

      - name: Run E2E tests
        env:
          PATH_APP_BASE_URL: http://127.0.0.1:8000
        run: npm run test:e2e

      - name: Stop PHP server
        if: always()
        run: |
          if [ -f /tmp/php-server.pid ]; then
            kill "$(cat /tmp/php-server.pid)" || true
          fi

  dev:
    name: Promote dev
    needs: validate
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: path-urenregistratie

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: path-urenregistratie/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Optional stage E2E
        env:
          PATH_APP_BASE_URL: ${{ vars.PATH_APP_BASE_URL }}
          PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
          PLAYWRIGHT_EMPLOYEE_PASSWORD: ${{ secrets.PLAYWRIGHT_EMPLOYEE_PASSWORD }}
        run: |
          if [ -z "${PATH_APP_BASE_URL:-}" ] || [ -z "${PLAYWRIGHT_ADMIN_PASSWORD:-}" ] || [ -z "${PLAYWRIGHT_EMPLOYEE_PASSWORD:-}" ]; then
            echo "Skipping stage e2e for dev (missing environment vars/secrets)."
            exit 0
          fi
          npm run test:e2e

  tst1:
    name: Promote tst1
    needs: dev
    runs-on: ubuntu-latest
    environment: tst1
    defaults:
      run:
        working-directory: path-urenregistratie

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: path-urenregistratie/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Optional stage E2E
        env:
          PATH_APP_BASE_URL: ${{ vars.PATH_APP_BASE_URL }}
          PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
          PLAYWRIGHT_EMPLOYEE_PASSWORD: ${{ secrets.PLAYWRIGHT_EMPLOYEE_PASSWORD }}
        run: |
          if [ -z "${PATH_APP_BASE_URL:-}" ] || [ -z "${PLAYWRIGHT_ADMIN_PASSWORD:-}" ] || [ -z "${PLAYWRIGHT_EMPLOYEE_PASSWORD:-}" ]; then
            echo "Skipping stage e2e for tst1 (missing environment vars/secrets)."
            exit 0
          fi
          npm run test:e2e

  acc:
    name: Promote acc
    needs: tst1
    runs-on: ubuntu-latest
    environment: acc
    defaults:
      run:
        working-directory: path-urenregistratie

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: path-urenregistratie/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Optional stage E2E
        env:
          PATH_APP_BASE_URL: ${{ vars.PATH_APP_BASE_URL }}
          PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
          PLAYWRIGHT_EMPLOYEE_PASSWORD: ${{ secrets.PLAYWRIGHT_EMPLOYEE_PASSWORD }}
        run: |
          if [ -z "${PATH_APP_BASE_URL:-}" ] || [ -z "${PLAYWRIGHT_ADMIN_PASSWORD:-}" ] || [ -z "${PLAYWRIGHT_EMPLOYEE_PASSWORD:-}" ]; then
            echo "Skipping stage e2e for acc (missing environment vars/secrets)."
            exit 0
          fi
          npm run test:e2e

  prod:
    name: Promote prod
    needs: acc
    runs-on: ubuntu-latest
    environment: prod
    if: ${{ inputs.ref == 'main' || inputs.ref == 'refs/heads/main' }}
    defaults:
      run:
        working-directory: path-urenregistratie

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: path-urenregistratie/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Optional prod E2E
        env:
          PATH_APP_BASE_URL: ${{ vars.PATH_APP_BASE_URL }}
          PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
          PLAYWRIGHT_EMPLOYEE_PASSWORD: ${{ secrets.PLAYWRIGHT_EMPLOYEE_PASSWORD }}
        run: |
          if [ -z "${PATH_APP_BASE_URL:-}" ] || [ -z "${PLAYWRIGHT_ADMIN_PASSWORD:-}" ] || [ -z "${PLAYWRIGHT_EMPLOYEE_PASSWORD:-}" ]; then
            echo "Skipping prod e2e (missing environment vars/secrets)."
            exit 0
          fi
          npm run test:e2e

  prod-main-ref-guard:
    name: Guard non-main for prod
    needs: acc
    runs-on: ubuntu-latest
    if: ${{ !(inputs.ref == 'main' || inputs.ref == 'refs/heads/main') }}

    steps:
      - name: Skip prod with non-main ref
        run: |
          echo "Production stage skipped because ref is '${{ inputs.ref }}'. Use main for prod promotion."
