            $adminHash = password_hash(getenv("PLAYWRIGHT_ADMIN_PASSWORD"), PASSWORD_DEFAULT);
            $employeeHash = password_hash(getenv("PLAYWRIGHT_EMPLOYEE_PASSWORD"), PASSWORD_DEFAULT);
            $q = $pdo->prepare("UPDATE users SET password_hash = :h WHERE email = :e AND role = :r");
            $q->execute([":h" => $adminHash, ":e" => "gio@example.invalid", ":r" => "administrator"]);
            $q->execute([":h" => $employeeHash, ":e" => "stasjo@example.invalid", ":r" => "employee"]);
            echo "Updated fallback login hashes.\n";
          '

      - name: Build
        run: npm run build

      - name: Smoke check
        run: npm run check

      - name: Resolve stage regression target
        env:
          STAGE_PATH_APP_BASE_URL: ${{ vars.PATH_APP_BASE_URL }}
          STAGE_PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
          STAGE_PLAYWRIGHT_EMPLOYEE_PASSWORD: ${{ secrets.PLAYWRIGHT_EMPLOYEE_PASSWORD }}
        run: |
          if [ -n "${STAGE_PATH_APP_BASE_URL:-}" ] && [ -n "${STAGE_PLAYWRIGHT_ADMIN_PASSWORD:-}" ] && [ -n "${STAGE_PLAYWRIGHT_EMPLOYEE_PASSWORD:-}" ]; then
            echo "PATH_APP_BASE_URL=${STAGE_PATH_APP_BASE_URL}" >> $GITHUB_ENV
            echo "PLAYWRIGHT_ADMIN_PASSWORD=${STAGE_PLAYWRIGHT_ADMIN_PASSWORD}" >> $GITHUB_ENV
            echo "PLAYWRIGHT_EMPLOYEE_PASSWORD=${STAGE_PLAYWRIGHT_EMPLOYEE_PASSWORD}" >> $GITHUB_ENV
            echo "Using configured dev stage target."
          else
            echo "PATH_APP_BASE_URL=http://127.0.0.1:8000" >> $GITHUB_ENV
            echo "Using local fallback regression target for dev."
          fi

      - name: Run stage E2E
        run: |
          npm run test:e2e

      - name: Stop fallback PHP server
        if: always()
        run: |
          if [ -f /tmp/php-server.pid ]; then
            kill "$(cat /tmp/php-server.pid)" || true
          fi

