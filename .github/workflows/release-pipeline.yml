name: Release Pipeline (Dev-Test-Acc-Prod)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/sha)"
        required: true
        default: "main"
        type: string
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-pipeline
  cancel-in-progress: true

env:
  TARGET_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

jobs:
  notify-team:
    name: Notify team on commit push
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}

    steps:
      - name: Post commit mention notification
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const commitSha = context.sha;
            const actor = String(context.actor || '').trim().toLowerCase();

            const fallbackUsers = ['giovannomaatsen-dev', 'kenrichlieveld'];
            const configured = [process.env.NOTIFY_USER_1, process.env.NOTIFY_USER_2]
              .filter(Boolean)
              .map(u => String(u).trim().replace(/^@/, ''));

            const excluded = String(process.env.NOTIFY_EXCLUDE_USERS || '')
              .split(',')
              .map(u => u.trim().replace(/^@/, '').toLowerCase())
              .filter(Boolean);

            const users = [...new Set((configured.length ? configured : fallbackUsers).filter(Boolean))]
              .filter(u => {
                const normalized = String(u).toLowerCase();
                return normalized !== actor && !excluded.includes(normalized);
              });

            if (users.length === 0) {
              core.info('Geen notify users beschikbaar.');
              return;
            }

            const mentions = users.map(u => `@${u}`).join(' ');
            const branch = String(context.ref || '').replace('refs/heads/', '');
            const historyUrl = `${context.serverUrl}/${owner}/${repo}/commits/${branch}`;
            const commitUrl = context.payload.head_commit?.url || `${context.serverUrl}/${owner}/${repo}/commit/${commitSha}`;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const body = [
              'Commit notificatie',
              '',
              mentions,
              '',
              `Branch: ${branch}`,
              `Auteur: @${context.actor}`,
              `Commit: ${commitSha}`,
              `Commit link: ${commitUrl}`,
              `Workflow run: ${runUrl}`,
              `History: ${historyUrl}`
            ].join('\n');

            await github.rest.repos.createCommitComment({
              owner,
              repo,
              commit_sha: commitSha,
              body
            });
        env:
          NOTIFY_USER_1: ${{ vars.NOTIFY_USER_1 }}
          NOTIFY_USER_2: ${{ vars.NOTIFY_USER_2 }}
          NOTIFY_EXCLUDE_USERS: ${{ vars.NOTIFY_EXCLUDE_USERS }}

  validate:
    name: Validate
    needs: notify-team
    if: ${{ always() && (needs.notify-team.result == 'success' || needs.notify-team.result == 'skipped') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: path-urenregistratie
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: path_urenregistratie
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_REF }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: path-urenregistratie/package-lock.json

      - name: Setup PHP with PDO MySQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium webkit

      - name: Write CI config.local.php
        run: |
          cat > server/config.local.php <<'PHP'
          <?php
          return [
              'environment' => 'development',
              'app_origin' => 'http://127.0.0.1:8000',
              'allow_demo_migrations' => true,
              'host' => '127.0.0.1',
              'database' => 'path_urenregistratie',
              'username' => 'root',
              'password' => 'root',
              'port' => 3306,
              'charset' => 'utf8mb4',
          ];
          PHP

      - name: Generate temporary test passwords
        run: |
          ADMIN_PASSWORD="$(openssl rand -base64 24 | tr -d '=+/\n' | head -c 24)"
          EMPLOYEE_PASSWORD="$(openssl rand -base64 24 | tr -d '=+/\n' | head -c 24)"
          echo "::add-mask::$ADMIN_PASSWORD"
          echo "::add-mask::$EMPLOYEE_PASSWORD"
          echo "PLAYWRIGHT_ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_EMPLOYEE_PASSWORD=$EMPLOYEE_PASSWORD" >> "$GITHUB_ENV"

      - name: Start PHP server
        run: |
          php -S 127.0.0.1:8000 -t . > /tmp/php-server.log 2>&1 &
          echo $! > /tmp/php-server.pid
          sleep 2

      - name: Verify local login hints
        run: node scripts/verify-local-login-hints.mjs

      - name: Run install + migrations
        run: |
          fetch_endpoint() {
            local url="$1"
            local output="$2"
            local label="$3"
            local max_attempts="$4"
            local ok=0

            for i in $(seq 1 "$max_attempts"); do
              http_code=$(curl -sS -o "$output" -w "%{http_code}" "$url" || true)
              if [ "$http_code" = "200" ]; then
                ok=1
                break
              fi

              echo "$label attempt $i failed with HTTP $http_code"
              if [ -f "$output" ]; then
                echo "--- $label response body ---"
                cat "$output"
                {
                  echo "## $label failure"
                  echo
                  echo "HTTP status: $http_code"
                  echo
                  echo '```json'
                  cat "$output"
                  echo '```'
                } >> "$GITHUB_STEP_SUMMARY"
              fi
              if [ -f /tmp/php-server.log ]; then
                echo "--- php-server.log tail ---"
                tail -n 200 /tmp/php-server.log
                {
                  echo
                  echo "### php-server.log tail"
                  echo
                  echo '```text'
                  tail -n 200 /tmp/php-server.log
                  echo '```'
                } >> "$GITHUB_STEP_SUMMARY"
              fi
              sleep 1
            done

            if [ "$ok" -ne 1 ]; then
              echo "$label failed after retries"
              exit 1
            fi
          }

          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:8000/server/health.php > /tmp/health.json; then
              break
            fi
            echo "Waiting for PHP server... attempt $i"
            sleep 1
          done
          cat /tmp/health.json

          fetch_endpoint "http://127.0.0.1:8000/server/install.php" "/tmp/install.json" "install.php" 20
          fetch_endpoint "http://127.0.0.1:8000/server/migrate.php" "/tmp/migrate.json" "migrate.php" 20

          cat /tmp/install.json
          cat /tmp/migrate.json

      - name: Upload install diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-validate-install-diagnostics
          retention-days: 7
          path: |
            /tmp/health.json
            /tmp/install.json
            /tmp/migrate.json
            /tmp/php-server.log
          if-no-files-found: warn

      - name: Set CI test password hashes in DB
        run: |
          php -r '
            $cfg = require "server/config.local.php";
            $dsn = "mysql:host={$cfg["host"]};port={$cfg["port"]};dbname={$cfg["database"]};charset={$cfg["charset"]}";
            $pdo = new PDO($dsn, $cfg["username"], $cfg["password"], [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
            $adminHash = password_hash(getenv("PLAYWRIGHT_ADMIN_PASSWORD"), PASSWORD_DEFAULT);
            $employeeHash = password_hash(getenv("PLAYWRIGHT_EMPLOYEE_PASSWORD"), PASSWORD_DEFAULT);
            $q = $pdo->prepare("UPDATE users SET password_hash = :h WHERE email = :e AND role = :r");
            $q->execute([":h" => $adminHash, ":e" => "gio@example.invalid", ":r" => "administrator"]);
            $q->execute([":h" => $employeeHash, ":e" => "stasjo@example.invalid", ":r" => "employee"]);
            echo "Updated CI login hashes.\n";
          '

      - name: Build
        run: npm run build

      - name: Smoke check
        run: npm run check

      - name: Stop CI PHP server before Playwright
        run: |
          if [ -f /tmp/php-server.pid ]; then
            kill "$(cat /tmp/php-server.pid)" || true
            rm -f /tmp/php-server.pid
          fi

      - name: Run E2E tests
        env:
          PATH_APP_BASE_URL: http://127.0.0.1:8000
          PLAYWRIGHT_ADMIN_EMAIL: gio@example.invalid
          PLAYWRIGHT_EMPLOYEE_EMAIL: stasjo@example.invalid
        run: npm run test:e2e

      - name: Stop PHP server
        if: always()
        run: |
          if [ -f /tmp/php-server.pid ]; then
            kill "$(cat /tmp/php-server.pid)" || true
          fi

