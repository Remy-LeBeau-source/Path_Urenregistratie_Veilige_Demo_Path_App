name: Commit Team Notification

# Notificeert pas ná een geslaagde CI-run op herontwerp, niet bij elke losse
# push — dat gaf voorheen twee losse regels/meldingen per commit (CI +
# deze), ook als CI daarna rood bleek. Zoals pilot-merge-queue.yml moet
# dit bestand op de default branch (main) staan om de workflow_run-trigger
# ook echt opgepikt te krijgen (GitHub-beperking, geen keuze) — tot die tijd
# blijft dit bestand op herontwerp inactief en verandert er niets.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  notify-team:
    name: Notify team on commit push
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'herontwerp')

    steps:
      - name: Post commit mention notification
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const commitSha = context.payload.workflow_run?.head_sha || context.sha;
            const fallbackUsers = ['giovannomaatsen-dev', 'kenrichlieveld'];
            const configured = [process.env.NOTIFY_USER_1, process.env.NOTIFY_USER_2]
              .filter(Boolean)
              .map(u => String(u).trim().replace(/^@/, ''));

            const excluded = String(process.env.NOTIFY_EXCLUDE_USERS || '')
              .split(',')
              .map(u => u.trim().replace(/^@/, '').toLowerCase())
              .filter(Boolean);

            const users = [...new Set([owner, ...(configured.length ? configured : fallbackUsers)].filter(Boolean))]
              .filter(u => {
                const normalized = String(u).toLowerCase();
                return !excluded.includes(normalized);
              });

            if (users.length === 0) {
              core.info('Geen notify users beschikbaar.');
              return;
            }

            const mentions = users.map(u => `@${u}`).join(' ');
            const branch = context.payload.workflow_run?.head_branch || String(context.ref || '').replace('refs/heads/', '');
            const author = context.payload.workflow_run?.actor?.login || context.actor;
            const historyUrl = `${context.serverUrl}/${owner}/${repo}/commits/${branch}`;
            const commitUrl = context.payload.head_commit?.url || `${context.serverUrl}/${owner}/${repo}/commit/${commitSha}`;
            const runUrl = context.payload.workflow_run?.html_url || `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const body = [
              'Commit notificatie',
              '',
              mentions,
              '',
              `Branch: ${branch}`,
              `Auteur: @${author}`,
              `Commit: ${commitSha}`,
              `Commit link: ${commitUrl}`,
              `Workflow run: ${runUrl}`,
              `History: ${historyUrl}`
            ].join('\n');

            await github.rest.repos.createCommitComment({
              owner,
              repo,
              commit_sha: commitSha,
              body
            });
        env:
          NOTIFY_USER_1: ${{ vars.NOTIFY_USER_1 }}
          NOTIFY_USER_2: ${{ vars.NOTIFY_USER_2 }}
          NOTIFY_EXCLUDE_USERS: ${{ vars.NOTIFY_EXCLUDE_USERS }}
